# Neuron Encrypt — Parent pipeline
# Each OS has its own standalone child pipeline under .gitlab/ci/
# Run from GitLab UI: CI/CD > Pipelines > Run pipeline,
# then click the individual "trigger" play buttons below.

stages:
  - build

# ---------------------------------------------------------------------------
# Linux — child pipeline: .gitlab/ci/linux.yml
# ---------------------------------------------------------------------------
linux:
  stage: build
  when: manual
  trigger:
    include: .gitlab/ci/linux.yml
    strategy: depend

# ---------------------------------------------------------------------------
# Windows — child pipeline: .gitlab/ci/windows.yml
# ---------------------------------------------------------------------------
windows:
  stage: build
  when: manual
  trigger:
    include: .gitlab/ci/windows.yml
    strategy: depend

# ---------------------------------------------------------------------------
# macOS — child pipeline: .gitlab/ci/macos.yml
# Requires a self-hosted runner registered with tag "macos"
# ---------------------------------------------------------------------------
macos:
  stage: build
  when: manual
  allow_failure: true
  trigger:
    include: .gitlab/ci/macos.yml
    strategy: depend

# ---------------------------------------------------------------------------
# Android — child pipeline: .gitlab/ci/android.yml
# Requires a runner with Android SDK/NDK (tag "android") or working network
# ---------------------------------------------------------------------------
android:
  stage: build
  when: manual
  allow_failure: true
  trigger:
    include: .gitlab/ci/android.yml
    strategy: depend
