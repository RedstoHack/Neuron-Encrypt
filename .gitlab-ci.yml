# GitLab CI/CD Pipeline for Neuron Encrypt
# Builds: Linux, Windows, macOS, Android

stages:
  - prepare
  - build-linux
  - build-windows
  - build-macos
  - build-android
  - package
  - release

variables:
  # Rust configuration
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C target-cpu=native"

  # Android
  ANDROID_SDK_ROOT: /opt/android-sdk
  ANDROID_HOME: /opt/android-sdk
  ANDROID_NDK_HOME: /opt/android-sdk/ndk/26.1.10909125
  ANDROID_NDK_ROOT: /opt/android-sdk/ndk/26.1.10909125

  # Cross-compilation
  CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
  CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: x86_64-apple-darwin23.0-clang

  # Artifacts
  ARTIFACT_EXPIRY: 30d

# Default image for Linux builds
default:
  image: rust:1.88-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
        clang
        lld
        ca-certificates
        curl
        file
        git
        pkg-config
        libssl-dev
        build-essential
        cmake
        ninja-build
    - rustup component add rustfmt clippy
    - rustup target add x86_64-unknown-linux-gnu
    - rustup target add x86_64-pc-windows-gnu
    - rustup target add x86_64-apple-darwin
    - cargo install cargo-ndk --locked --version 4.1.2 || true

# =============================================================================
# PREPARE STAGE
# =============================================================================
prepare:
  stage: prepare
  script:
    - echo "Preparing build environment..."
    - cargo fetch --locked
    - cargo generate-lockfile
  artifacts:
    paths:
      - Cargo.lock
    expire_in: 1h

# =============================================================================
# LINUX BUILD (native)
# =============================================================================
build-linux:
  stage: build-linux
  needs: [prepare]
  script:
    - echo "Building for Linux (x86_64-unknown-linux-gnu)..."
    - cargo build --release --locked --all-targets
    - cargo test --release --locked --lib
  artifacts:
    paths:
      - neuron-encrypt/target/release/neuron-encrypt
      - neuron-encrypt/target/release/neuron-encrypt-cli
    expire_in: $ARTIFACT_EXPIRY
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"

# =============================================================================
# WINDOWS BUILD (cross-compilation from Linux)
# =============================================================================
build-windows:
  stage: build-windows
  needs: [prepare]
  variables:
    CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER: "wine64"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
        mingw-w64
        wine64
    - rustup target add x86_64-pc-windows-gnu
  script:
    - echo "Building for Windows (x86_64-pc-windows-gnu)..."
    - cargo build --release --locked --target x86_64-pc-windows-gnu
  artifacts:
    paths:
      - neuron-encrypt/target/x86_64-pc-windows-gnu/release/neuron-encrypt.exe
      - neuron-encrypt/target/x86_64-pc-windows-gnu/release/neuron-encrypt-cli.exe
    expire_in: $ARTIFACT_EXPIRY
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"

# =============================================================================
# MACOS BUILD (cross-compilation from Linux)
# =============================================================================
build-macos:
  stage: build-macos
  needs: [prepare]
  variables:
    MACOSX_DEPLOYMENT_TARGET: "10.15"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
        clang
        lld
        libxml2-dev
    - rustup target add x86_64-apple-darwin
    # Install macOS SDK for cross-compilation
    - |
      if [ ! -d "/opt/macos-sdk" ]; then
        mkdir -p /opt/macos-sdk
        cd /opt/macos-sdk
        curl -L -o MacOSX13.3.sdk.tar.xz https://github.com/phracker/MacOSX-SDKs/releases/download/13.3/MacOSX13.3.sdk.tar.xz
        tar -xf MacOSX13.3.sdk.tar.xz
        rm MacOSX13.3.sdk.tar.xz
      fi
    - export SDKROOT=/opt/macos-sdk/MacOSX13.3.sdk
  script:
    - echo "Building for macOS (x86_64-apple-darwin)..."
    - cargo build --release --locked --target x86_64-apple-darwin
  artifacts:
    paths:
      - neuron-encrypt/target/x86_64-apple-darwin/release/neuron-encrypt
      - neuron-encrypt/target/x86_64-apple-darwin/release/neuron-encrypt-cli
    expire_in: $ARTIFACT_EXPIRY
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"

# =============================================================================
# ANDROID BUILD
# =============================================================================
build-android:
  stage: build-android
  needs: [prepare]
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
        openjdk-17-jdk-headless
        gradle
        unzip
        wget
        curl
        ca-certificates
    - export ANDROID_SDK_ROOT=/opt/android-sdk
    - export ANDROID_HOME=/opt/android-sdk
    - export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
    - |
      if [ ! -d "$ANDROID_SDK_ROOT" ]; then
        mkdir -p $ANDROID_SDK_ROOT
        cd $ANDROID_SDK_ROOT
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
        unzip -q cmdtools.zip -d cmdline-tools
        mv cmdline-tools latest
        rm cmdtools.zip
      fi
    - yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
    - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.1.10909125"
    - export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
    - export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
    - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
    - cargo install cargo-ndk --locked --version 4.1.2
  script:
    - cd android
    - chmod +x build-rust.sh
    - ./build-rust.sh
    - export ANDROID_SDK_ROOT=/opt/android-sdk
    - export ANDROID_HOME=/opt/android-sdk
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - export PATH="/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH"
    - ./gradlew :app:assembleStandardDebug --no-daemon
  artifacts:
    paths:
      - android/app/build/outputs/apk/standard/debug/app-standard-debug.apk
    expire_in: $ARTIFACT_EXPIRY
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"

# =============================================================================
# PACKAGE STAGE - Create release archives
# =============================================================================
package:
  stage: package
  needs:
    - build-linux
    - build-windows
    - build-macos
    - build-android
  image: alpine:3.20
  script:
    - apk add --no-cache zip tar
    - mkdir -p release
    - VERSION=$(grep '^version =' neuron-encrypt/Cargo.toml | cut -d'"' -f2)
    - echo "Packaging version $VERSION..."
    # Linux
    - mkdir -p release/neuron-encrypt-$VERSION-linux-x86_64
    - cp neuron-encrypt/target/release/neuron-encrypt release/neuron-encrypt-$VERSION-linux-x86_64/
    - cp neuron-encrypt/target/release/neuron-encrypt-cli release/neuron-encrypt-$VERSION-linux-x86_64/
    - tar -czf release/neuron-encrypt-$VERSION-linux-x86_64.tar.gz -C release neuron-encrypt-$VERSION-linux-x86_64
    # Windows
    - mkdir -p release/neuron-encrypt-$VERSION-windows-x86_64
    - cp neuron-encrypt/target/x86_64-pc-windows-gnu/release/neuron-encrypt.exe release/neuron-encrypt-$VERSION-windows-x86_64/
    - cp neuron-encrypt/target/x86_64-pc-windows-gnu/release/neuron-encrypt-cli.exe release/neuron-encrypt-$VERSION-windows-x86_64/
    - zip -r release/neuron-encrypt-$VERSION-windows-x86_64.zip release/neuron-encrypt-$VERSION-windows-x86_64
    # macOS
    - mkdir -p release/neuron-encrypt-$VERSION-macos-x86_64
    - cp neuron-encrypt/target/x86_64-apple-darwin/release/neuron-encrypt release/neuron-encrypt-$VERSION-macos-x86_64/
    - cp neuron-encrypt/target/x86_64-apple-darwin/release/neuron-encrypt-cli release/neuron-encrypt-$VERSION-macos-x86_64/
    - tar -czf release/neuron-encrypt-$VERSION-macos-x86_64.tar.gz -C release neuron-encrypt-$VERSION-macos-x86_64
    # Android
    - mkdir -p release/neuron-encrypt-$VERSION-android
    - cp android/app/build/outputs/apk/standard/debug/app-standard-debug.apk release/neuron-encrypt-$VERSION-android/neuron-encrypt-$VERSION.apk
    # Checksums
    - cd release && sha256sum *.tar.gz *.zip *.apk > SHA256SUMS.txt
    - cat SHA256SUMS.txt
  artifacts:
    paths:
      - release/*.tar.gz
      - release/*.zip
      - release/*.apk
      - release/SHA256SUMS.txt
    expire_in: $ARTIFACT_EXPIRY
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"

# =============================================================================
# MANUAL RELEASE DEPLOYMENT (triggered manually)
# =============================================================================
release:
  stage: release
  needs: [package]
  when: manual
  image: alpine:3.20
  script:
    - apk add --no-cache curl jq
    - VERSION=$(grep '^version =' neuron-encrypt/Cargo.toml | cut -d'"' -f2)
    - echo "Creating GitLab release for version $VERSION..."
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"v$VERSION\",
          \"tag_name\": \"v$VERSION\",
          \"description\": \"Release v$VERSION\\n\\nSee CHANGELOG.md for details.\",
          \"ref\": \"$CI_COMMIT_SHA\",
          \"assets\": {
            \"links\": [
              {\"name\": \"Linux x86_64\", \"url\": \"$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_SHA/raw/release/neuron-encrypt-$VERSION-linux-x86_64.tar.gz?job=package\"},
              {\"name\": \"Windows x86_64\", \"url\": \"$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_SHA/raw/release/neuron-encrypt-$VERSION-windows-x86_64.zip?job=package\"},
              {\"name\": \"macOS x86_64\", \"url\": \"$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_SHA/raw/release/neuron-encrypt-$VERSION-macos-x86_64.tar.gz?job=package\"},
              {\"name\": \"Android APK\", \"url\": \"$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_SHA/raw/release/neuron-encrypt-$VERSION-android/neuron-encrypt-$VERSION.apk?job=package\"}
            ]
        }" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
    - echo "Release created successfully!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"
      when: manual
  only:
    - tags

# =============================================================================
# SCHEDULED NIGHTLY BUILD (optional)
# =============================================================================
nightly:
  stage: build-linux
  needs: [prepare]
  variables:
    RUSTFLAGS: "-C target-cpu=native -Z sanitizer=address"
  script:
    - echo "Running nightly build with sanitizers..."
    - rustup override set nightly
    - cargo test --locked --all-targets
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
# =============================================================================
# CODE QUALITY CHECKS
# =============================================================================
quality-checks:
  stage: prepare
  needs: []
  script:
    - echo "Running code quality checks..."
    - cargo fmt --all -- --check
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo audit --deny warnings || echo "Audit warnings found, review manually"
    - cargo deny check || echo "Deny checks failed, review manually"
  artifacts:
    reports:
      sast: gl-sast-report.json
    expire_in: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# SECURITY AUDIT
# =============================================================================
security-audit:
  stage: prepare
  needs: []
  script:
    - cargo install cargo-audit --locked
    - cargo audit --deny warnings
    - cargo install cargo-deny --locked
    - cargo deny check
  artifacts:
    reports:
      sast: gl-sast-report.json
    expire_in: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true

# =============================================================================
# DOCS DEPLOY (on tag push)
# =============================================================================
pages:
  stage: deploy
  needs: [package]
  image: alpine:3.20
  script:
    - apk add --no-cache cargo
    - cargo doc --no-deps --document-private-items
    - mv target/doc public
  artifacts:
    paths:
      - public
    expire_in: 30d
  rules:
    - if: $CI_COMMIT_TAG
  only:
    - tags

# =============================================================================
# CACHE CONFIGURATION
# =============================================================================
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/registry/
    - .cargo/git/
    - target/
    - neuron-encrypt/target/
    - android/app/build/
    - android/.gradle/
  policy: pull-push

# =============================================================================
# MERGE REQUEST PIPELINE
# =============================================================================
mr-pipeline:
  stage: prepare
  needs: []
  script:
    - echo "Running MR pipeline checks..."
    - cargo check --all-targets --all-features
    - cargo test --locked --lib
    - cargo fmt --all -- --check
    - cargo clippy --all-targets --all-features -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: false

# =============================================================================
# DOCKER IMAGE BUILD (for consistent builds)
# =============================================================================
docker-build:
  stage: prepare
  needs: []
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
  script:
    - docker build -t neuron-encrypt-builder -f Dockerfile.builder .
    - docker push $CI_REGISTRY_IMAGE/builder:$CI_COMMIT_SHA
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  only:
    - tags

# =============================================================================
# RELEASE NOTES GENERATION
# =============================================================================
changelog:
  stage: package
  needs: [package]
  image: alpine:3.20
  script:
    - apk add --no-cache git
    - VERSION=$(grep '^version =' neuron-encrypt/Cargo.toml | cut -d'"' -f2)
    - echo "Generating changelog for v$VERSION..."
    - git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD > release/CHANGELOG_v$VERSION.md
    - cat release/CHANGELOG_v$VERSION.md
  artifacts:
    paths:
      - release/CHANGELOG_v*.md
    expire_in: $ARTIFACT_EXPIRY
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"

