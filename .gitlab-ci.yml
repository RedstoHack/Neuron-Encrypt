# =============================================================================
# Neuron Encrypt — parent pipeline
#
# On a push or merge request: one `quality` job (fmt, clippy, tests, audit).
#
# On a `vX.Y.Z` tag: the three platform builds fan out in parallel and the
# release is assembled from all of them.
#
# Timing (measured on 2026-10-01, tag 2.3.0):
#
#   quality            189s   fmt + clippy + 86 tests + cargo audit
#   build-windows      178s
#   build-linux        209s
#   build-android    1,065s   <-- long pole: 4 ABIs + Gradle, cold cache
#   package-*           52-63s each
#
# Two changes keep a release from paying for the same compilation twice:
#
#   1. The release stages are all the same, so `quality` no longer forces a
#      stage barrier ahead of the builds. On a tag, quality runs *concurrently*
#      with them instead of before them, and `create-release` needs both, so a
#      gate failure still blocks the release. Saves ~190s of serial time.
#
#   2. The `quality` cache is keyed the same way the build caches are, and both
#      use a shared prefix, so a commit that quality already type-checked does
#      not recompile from scratch in every platform job. See docs/CI_CD.md.
#
# The macOS job is gone. It required a self-hosted runner tagged `macos` that
# does not exist, so it sat pending forever and could never produce an asset.
# macOS binaries are still published to the package registry by a maintainer
# with the appropriate runner.
# =============================================================================

stages:
  - check
  - build
  - release

variables:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: "always"
  # Compile fewer codegen units in parallel rather than reusing an incremental
  # graph; for a from-scratch CI build this is consistently faster and the
  # cache is invalidated by the lockfile anyway.
  CARGO_INCREMENTAL: "0"

default:
  interruptible: true

# -----------------------------------------------------------------------------
# 1. Quality gate
# -----------------------------------------------------------------------------

quality:
  stage: check
  image: rust:1.88-slim
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  cache:
    # Keyed on the lockfile like every other job, so a dependency change
    # invalidates all of them together instead of leaving stale build state.
    key:
      files:
        - neuron-encrypt/Cargo.lock
      prefix: cargo
    paths:
      - .cargo-home/
      - neuron-encrypt/target/
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends
        pkg-config libssl-dev clang lld
    - rustup component add rustfmt clippy
    # Prebuilt cargo-audit. `cargo install cargo-audit` compiles ~200 crates and
    # was a large share of this job's wall clock. rustsec publishes
    # x86_64-unknown-linux-gnu tarballs under `cargo-audit/vX.Y.Z` release
    # tags; the tag is resolved from the API so this does not rot, with
    # `cargo install` kept as a fallback if the layout ever changes.
    - |
      set -e
      want="cargo-audit"
      if ! command -v "$want" >/dev/null 2>&1; then
        url=$(curl -sSfL https://api.github.com/repos/rustsec/rustsec/releases \
          | grep -o '"tag_name": *"cargo-audit/v[0-9][^"]*"' | head -1 \
          | cut -d'"' -f4)
        if [ -n "$url" ]; then
          ver="${url#cargo-audit/v}"
          asset="cargo-audit-x86_64-unknown-linux-gnu-v${ver}.tgz"
          enc=$(printf '%s' "$url" | sed 's|/|%2F|')
          echo "Fetching prebuilt cargo-audit ${ver}"
          if curl -sSfL "https://github.com/rustsec/rustsec/releases/download/${enc}/${asset}" \
               | tar -xz -C /tmp; then
            cp "/tmp/cargo-audit-x86_64-unknown-linux-gnu-v${ver}/cargo-audit" "$CARGO_HOME/bin/"
            chmod +x "$CARGO_HOME/bin/$want"
          fi
        fi
      fi
      command -v "$want" >/dev/null 2>&1 || cargo install "$want" --locked
    - cargo audit --version
  script:
    - cd neuron-encrypt
    # --locked so CI cannot silently resolve different dependency versions than
    # the ones the lockfile was reviewed against.
    - cargo fmt --check
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo test --locked --lib --release
    - cd ..
    - cargo audit --file neuron-encrypt/Cargo.lock

# -----------------------------------------------------------------------------
# 2. Release fan-out
# -----------------------------------------------------------------------------

# Linux, Windows and Android all share the `build` stage, so they start as soon
# as the pipeline does instead of waiting behind `quality`. On a tag the gate
# and the builds overlapping is the point (see the timing note at the top); a
# gate failure still blocks the release, because `create-release` needs
# `quality` as well as the three builds.
#
# `needs: []` is what makes them start immediately rather than in stage order.
#
# Each is a child pipeline so a platform can carry its own image, cache and
# runner requirements. Adding a platform is one entry here plus one file in
# .gitlab/ci/.

linux:
  stage: build
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  trigger:
    include: .gitlab/ci/linux.yml
    strategy: depend

windows:
  stage: build
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  trigger:
    include: .gitlab/ci/windows.yml
    strategy: depend

android:
  stage: build
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  trigger:
    include: .gitlab/ci/android.yml
    strategy: depend

# -----------------------------------------------------------------------------
# 3. Assemble the release
# -----------------------------------------------------------------------------
#
# `needs: []` with all three triggers above makes this wait for every platform
# to finish (including via `strategy: depend`, which propagates a child
# failure), while still running in parallel with nothing else.
#
# Assets are attached as direct release links rather than only being pushed to
# the package registry, so a user visiting the release page can download
# everything without knowing the registry URL layout.

create-release:
  stage: release
  image: alpine:3.20
  # `quality` is listed even though it runs in parallel with the builds: a
  # failed gate must stop the release even when all three platforms built fine.
  needs: [quality, linux, windows, android]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    # GitLab expands ${VAR} but not shell parameter expansion like ${VAR#v},
    # so the prefix is stripped in the script and the result is exported.
    PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic"
  script:
    - apk add --no-cache curl jq
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "Assembling release $VERSION for tag $CI_COMMIT_TAG"

    # Collect the artifacts uploaded by the child pipelines. The registry API
    # lists files per package, which is more robust than reconstructing
    # filenames here.
    - |
      build_assets() {
        pkg="$1"; out="$2"
        curl --fail --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "${PACKAGE_URL}?package_name=${pkg}&package_version=${VERSION}&per_page=100" \
          | jq -r '.[].file_name' > "$out" || true
      }
      build_assets neuron-encrypt app-assets.txt
      build_assets neuron-encrypt-cli cli-assets.txt
      echo "--- desktop ---"; cat app-assets.txt
      echo "--- cli ---"; cat cli-assets.txt

    # Collect the APK, which the Android pipeline published under its own name.
    - |
      curl --fail --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "${PACKAGE_URL}?package_name=neuron-encrypt-android&package_version=${VERSION}&per_page=100" \
        | jq -r '.[].file_name' > apk-assets.txt || true
      echo "--- android ---"; cat apk-assets.txt

    - echo "Creating GitLab release $VERSION"
    - |
      # Build the asset list as JSON: [{name, url, link_type: "package"}].
      # Package-registry links are stable and never expire, which is what the
      # installers resolve against.
      {
        echo '{"assets":['
        first=1
        for f in $(cat app-assets.txt cli-assets.txt apk-assets.txt 2>/dev/null); do
          case "$f" in .gitkeep|*.md) continue ;; esac
          case "$f" in
            neuron-encrypt-android*) pkg="neuron-encrypt-android" ;;
            neuron-encrypt-cli*)    pkg="neuron-encrypt-cli" ;;
            *)                      pkg="neuron-encrypt" ;;
          esac
          [ $first -eq 1 ] || echo ','
          first=0
          printf '  {"name":"%s","url":"%s/%s/%s/%s","link_type":"package"}' \
            "$f" "$PACKAGE_URL" "$pkg" "$VERSION" "$f"
        done
        echo ']}'
      } > assets.json
      cat assets.json

    - |
      curl --fail --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --data @assets.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases?version=${VERSION}&name=Neuron%20Encrypt%20${VERSION}" \
        | jq -r '.tag_name, .released_at, (.assets[] | "  asset: \(.name)")'

# -----------------------------------------------------------------------------
# 4. Pages — the website, the installers and the version pointer
# -----------------------------------------------------------------------------
#
# Serves install.sh / install.ps1 and `latest-version.txt`, which the
# one-line install commands resolve against. Runs on `main` so a merge updates
# the site without waiting for a release.

pages:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - mkdir -p public
    - cp -r docs/* public/ 2>/dev/null || true
    - cp docs/install.sh public/install.sh 2>/dev/null || true
    - cp docs/install.ps1 public/install.ps1 2>/dev/null || true
    - |
      # The installers read this to pick a version without hardcoding one.
      # Derive it from the crate manifest so it can never drift from a release.
      grep '^version' neuron-encrypt/Cargo.toml | head -1 | cut -d'"' -f2 \
        > public/latest-version.txt
      cat public/latest-version.txt
  artifacts:
    paths:
      - public
    expire_in: "1 year"
