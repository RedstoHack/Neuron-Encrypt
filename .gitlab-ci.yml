# =============================================================================
# Neuron Encrypt — parent pipeline
#
# On a push or merge request: one `quality` job (fmt, clippy, tests, audit).
#
# On a `vX.Y.Z` tag: the three platform builds fan out in parallel and the
# release is assembled from all of them.
#
# Timing (measured on 2026-10-01, tag 2.3.0):
#
#   quality            189s   fmt + clippy + 86 tests + cargo audit
#   build-windows      178s
#   build-linux        209s
#   build-android    1,065s   <-- long pole: 4 ABIs + Gradle, cold cache
#   package-*           52-63s each
#
# Two changes keep a release from paying for the same compilation twice:
#
#   1. The release stages are all the same, so `quality` no longer forces a
#      stage barrier ahead of the builds. On a tag, quality runs *concurrently*
#      with them instead of before them, and `create-release` needs both, so a
#      gate failure still blocks the release. Saves ~190s of serial time.
#
#   2. The `quality` cache is keyed the same way the build caches are, and both
#      use a shared prefix, so a commit that quality already type-checked does
#      not recompile from scratch in every platform job. See docs/CI_CD.md.
#
# The macOS job used to require a self-hosted runner tagged `macos` that does not
# exist on this instance, so it sat pending forever and never produced an asset.
# It now cross-compiles the CLI from Linux with osxcross, which works because the
# GUI stack is behind the optional `gui` feature. The desktop GUI is still not
# published for macOS — see .gitlab/ci/macos.yml.
# =============================================================================

stages:
  - check
  - build
  - release

variables:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: "always"
  # Compile fewer codegen units in parallel rather than reusing an incremental
  # graph; for a from-scratch CI build this is consistently faster and the
  # cache is invalidated by the lockfile anyway.
  CARGO_INCREMENTAL: "0"

default:
  interruptible: true

# -----------------------------------------------------------------------------
# 1. Quality gate
# -----------------------------------------------------------------------------

quality:
  stage: check
  image: rust:1.88-slim
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  cache:
    # Keyed on the lockfile like every other job, so a dependency change
    # invalidates all of them together instead of leaving stale build state.
    key:
      files:
        - neuron-encrypt/Cargo.lock
      prefix: cargo
    paths:
      - .cargo-home/
      - neuron-encrypt/target/
  before_script:
    # curl is needed to fetch the prebuilt cargo-audit below; the slim Rust
    # image does not ship it. ca-certificates is included because the
    # rust:slim base has no CA bundle, and curl then fails with exit 77.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends
        pkg-config libssl-dev clang lld curl ca-certificates
    - rustup component add rustfmt clippy
    # Prebuilt cargo-audit. `cargo install cargo-audit` compiles ~200 crates and
    # was a large share of this job's wall clock.
    #
    # The *musl* build specifically: the -gnu build is dynamically linked
    # against glibc 2.39 and dies with "version `GLIBC_2.39' not found" on the
    # bookworm-based rust:1.88-slim image. The musl build is static and runs
    # anywhere. The tag is resolved from the API so this does not rot, and the
    # binary is executed before being trusted, with `cargo install` as fallback.
    - |
      set -e
      want="cargo-audit"
      # A cold cache has no $CARGO_HOME/bin at all; the first run must create it
      # or the cp below fails with "No such file or directory".
      mkdir -p "$CARGO_HOME/bin"
      if ! command -v "$want" >/dev/null 2>&1; then
        url=$(curl -sSfL https://api.github.com/repos/rustsec/rustsec/releases \
          | grep -o '"tag_name": *"cargo-audit/v[0-9][^"]*"' | head -1 \
          | cut -d'"' -f4)
        if [ -n "$url" ]; then
          ver="${url#cargo-audit/v}"
          asset="cargo-audit-x86_64-unknown-linux-musl-v${ver}.tgz"
          enc=$(printf '%s' "$url" | sed 's|/|%2F|')
          echo "Fetching prebuilt cargo-audit ${ver} (musl)"
          if curl -sSfL "https://github.com/rustsec/rustsec/releases/download/${enc}/${asset}" \
               | tar -xz -C /tmp; then
            cp "/tmp/cargo-audit-x86_64-unknown-linux-musl-v${ver}/cargo-audit" "$CARGO_HOME/bin/"
            chmod +x "$CARGO_HOME/bin/$want"
            # Only keep it if it actually runs here; otherwise fall through to
            # building from source.
            if ! "$CARGO_HOME/bin/$want" --version >/dev/null 2>&1; then
              echo "prebuilt cargo-audit cannot run on this image; building from source"
              rm -f "$CARGO_HOME/bin/$want"
            fi
          fi
        fi
      fi
      # The cached $CARGO_HOME may already list the package from a previous run
      # even though the binary is gone, so clear the record and force: without
      # this the fallback dies with "binary `cargo-audit` already exists in
      # destination" (exit 101).
      command -v "$want" >/dev/null 2>&1 || {
        cargo uninstall "$want" >/dev/null 2>&1 || true
        cargo install "$want" --locked --force
      }
    - cargo audit --version
    - |
      set -e
      want="cargo-deny"
      mkdir -p "$CARGO_HOME/bin"
      if ! command -v "$want" >/dev/null 2>&1; then
        ver="$(curl -sSfL https://api.github.com/repos/EmbarkStudios/cargo-deny/releases/latest \
          | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)"
        if [ -n "$ver" ]; then
          asset="cargo-deny-${ver}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${ver}/${asset}"
          if curl -sSfL -o /tmp/cargo-deny.tar.gz "$url" \
            && curl -sSfL -o /tmp/cargo-deny.tar.gz.sha256 "${url}.sha256"; then
            # The release publishes a .sha256 next to every asset — verify it
            # before unpacking. An unverified "download and run" is how a
            # compromised registry turns into a compromised build.
            if (cd /tmp && sha256sum -c cargo-deny.tar.gz.sha256 >/dev/null 2>&1); then
              tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
              cp /tmp/cargo-deny-${ver}-x86_64-unknown-linux-musl/cargo-deny "$CARGO_HOME/bin/"
              chmod +x "$CARGO_HOME/bin/$want"
              if ! "$CARGO_HOME/bin/$want" --version >/dev/null 2>&1; then
                echo "prebuilt cargo-deny cannot run on this image; building from source"
                rm -f "$CARGO_HOME/bin/$want"
              fi
            else
              echo "cargo-deny checksum mismatch — not installing it"
            fi
          fi
        fi
      fi
      command -v "$want" >/dev/null 2>&1 || {
        cargo uninstall "$want" >/dev/null 2>&1 || true
        cargo install "$want" --locked --force
      }
    - cargo deny --version
  script:
    - cd neuron-encrypt
    # --locked so CI cannot silently resolve different dependency versions than
    # the ones the lockfile was reviewed against.
    - cargo fmt --check
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo test --locked --lib --release
    - cd ..
    # Audit *both* lockfiles. The Android pipeline publishes the JNI crate, and
    # its dependency graph is separate from the core crate's — auditing only
    # the core left the shipped APK's dependencies unchecked.
    - cargo audit --file neuron-encrypt/Cargo.lock
    - cargo audit --file android/neuron-encrypt-jni/Cargo.lock
    # The license/advisory policy in neuron-encrypt/deny.toml. This gate used
    # to run only in the GitHub workflow, so the pipeline that actually
    # publishes the release never enforced it.
    - cd neuron-encrypt && cargo deny check && cd ..

# -----------------------------------------------------------------------------
# 2. Release fan-out
# -----------------------------------------------------------------------------

# Linux, Windows and Android all share the `build` stage, so they start as soon
# as the pipeline does instead of waiting behind `quality`. On a tag the gate
# and the builds overlapping is the point (see the timing note at the top); a
# gate failure still blocks the release, because `create-release` needs
# `quality` as well as the three builds.
#
# `needs: []` is what makes them start immediately rather than in stage order.
#
# Each is a child pipeline so a platform can carry its own image, cache and
# runner requirements. Adding a platform is one entry here plus one file in
# .gitlab/ci/.

linux:
  stage: build
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  trigger:
    include: .gitlab/ci/linux.yml
    strategy: depend

windows:
  stage: build
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  trigger:
    include: .gitlab/ci/windows.yml
    strategy: depend

android:
  stage: build
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  trigger:
    include: .gitlab/ci/android.yml
    strategy: depend

# CLI only, cross-compiled with osxcross. Replaces the old job that needed a
# `macos` runner tag which does not exist on this instance and so sat pending
# forever. See .gitlab/ci/macos.yml for why the GUI is not included.
macos:
  stage: build
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  trigger:
    include: .gitlab/ci/macos.yml
    strategy: depend

# -----------------------------------------------------------------------------
# 3. Assemble the release
# -----------------------------------------------------------------------------
#
# `needs: []` with all three triggers above makes this wait for every platform
# to finish (including via `strategy: depend`, which propagates a child
# failure), while still running in parallel with nothing else.
#
# Assets are attached as direct release links rather than only being pushed to
# the package registry, so a user visiting the release page can download
# everything without knowing the registry URL layout.

create-release:
  stage: release
  image: alpine:3.20
  # `quality` is listed even though it runs in parallel with the builds: a
  # failed gate must stop the release even when all three platforms built fine.
  needs: [quality, linux, windows, android, macos]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    # GitLab expands ${VAR} but not shell parameter expansion like ${VAR#v},
    # so the prefix is stripped in the script and the result is exported.
    PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic"
  script:
    - apk add --no-cache curl jq
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "Assembling release $VERSION for tag $CI_COMMIT_TAG"

    # The asset list is built from the filenames the packaging jobs publish,
    # and each is confirmed with a HEAD request before being attached.
    #
    # An earlier version asked the registry to list a package's files and
    # parsed the result with jq. That listing returned nothing for all three
    # packages, so the release was POSTed with an empty asset array and GitLab
    # rejected it with a 400 — while every artifact was in fact published and
    # downloadable. Explicit names plus a reachability check cannot silently
    # produce an empty list, and a missing artifact is reported by name.
    - |
      add() {
        pkg="$1"; file="$2"
        url="${PACKAGE_URL}/${pkg}/${VERSION}/${file}"
        if curl --fail --silent --head "$url" >/dev/null 2>&1; then
          echo "$file|$url"
        else
          echo "WARN: not published, skipping $file" >&2
        fi
      }

      {
        # Desktop: Linux tar.gz, Linux AppImage, and their checksums.
        add neuron-encrypt "neuron-encrypt-${VERSION}-linux-x86_64.tar.gz"
        add neuron-encrypt "neuron-encrypt-${VERSION}-linux-x86_64.AppImage"
        add neuron-encrypt "SHA256SUMS-linux.txt"
        add neuron-encrypt "SHA256SUMS-appimage.txt"

        # Windows: GUI+CLI zip and the standalone CLI.
        add neuron-encrypt "neuron-encrypt-${VERSION}-windows-x86_64.zip"
        add neuron-encrypt-cli "neuron-encrypt-cli-${VERSION}-windows-x86_64.exe"
        add neuron-encrypt-cli "SHA256SUMS-cli-windows.txt"
        add neuron-encrypt-cli "SHA256SUMS-windows.txt"

        # Linux CLI.
        add neuron-encrypt-cli "neuron-encrypt-cli-${VERSION}-linux-x86_64"
        add neuron-encrypt-cli "SHA256SUMS-cli-linux.txt"

        # macOS CLI, cross-compiled with osxcross.
        add neuron-encrypt-cli "neuron-encrypt-cli-${VERSION}-macos-x86_64"
        add neuron-encrypt-cli "SHA256SUMS-cli-macos.txt"

        # Android: unsigned (F-Droid) and signed APKs.
        add neuron-encrypt "neuron-encrypt-${VERSION}-android.apk"
        add neuron-encrypt-android "neuron-encrypt-${VERSION}-android-signed.apk"
      } > assets.txt
      cat assets.txt

    - echo "Creating GitLab release $VERSION"
    - |
      # Create the release first, then attach each link.
      #
      # Passing assets inline on the create call does not work on this GitLab
      # instance: a bare list gives "assets is invalid", an empty list gives
      # the same, and the {links:[...]} hash is accepted but silently drops
      # every link. POSTing to /assets/links one object at a time is the form
      # that actually attaches them, so that is what is used here.
      NOTES="docs/releases/RELEASE_NOTES_${VERSION}.md"
      if [ -f "$NOTES" ]; then
        desc=$(jq -Rs . < "$NOTES")
      else
        echo "WARN: $NOTES not found; releasing without a description" >&2
        desc=$(printf '"Neuron Encrypt %s"' "$VERSION")
      fi
      jq -n --arg tag "$CI_COMMIT_TAG" --arg name "Neuron Encrypt $VERSION" \
            --argjson desc "$desc" \
        '{tag_name: $tag, name: $name, description: $desc}' > release.json
      curl --fail --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data @release.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" \
        | jq -r '"created release " + .tag_name'

    - |
      attached=0
      while IFS='|' read -r name url; do
        [ -n "$name" ] || continue
        jq -n --arg n "$name" --arg u "$url" '{name: $n, url: $u}' > link.json
        if curl --fail --silent --request POST \
             --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --header "Content-Type: application/json" \
             --data @link.json \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links" \
             >/dev/null; then
          echo "  attached $name"
          attached=$((attached + 1))
        else
          echo "  WARN could not attach $name" >&2
        fi
      done < assets.txt
      echo "attached $attached asset link(s)"
      if [ "$attached" -eq 0 ]; then
        echo "ERROR: no assets attached; the release would be empty" >&2
        exit 1
      fi

# -----------------------------------------------------------------------------
# 4. Pages — the website, the installers and the version pointer
# -----------------------------------------------------------------------------
#
# Serves install.sh / install.ps1 and `latest-version.txt`, which the
# one-line install commands resolve against. Runs on `main` so a merge updates
# the site without waiting for a release.

pages:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - mkdir -p public
    - cp -r docs/* public/ 2>/dev/null || true
    - cp docs/install.sh public/install.sh 2>/dev/null || true
    - cp docs/install.ps1 public/install.ps1 2>/dev/null || true
    - |
      # The installers read this to pick a version without hardcoding one.
      # Derive it from the crate manifest so it can never drift from a release.
      grep '^version' neuron-encrypt/Cargo.toml | head -1 | cut -d'"' -f2 \
        > public/latest-version.txt
      cat public/latest-version.txt
  artifacts:
    paths:
      - public
    expire_in: "1 year"
