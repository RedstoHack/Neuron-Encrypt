name: Mirror GitLab to GitHub

on:
  schedule:
    - cron: '0 */3 * * *' # Запуск каждые 3 часа
  workflow_dispatch: # Возможность ручного запуска из вкладки Actions

permissions:
  contents: write # Разрешаем создание тегов, коммитов и релизов через встроенный токен

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Явно передаем токен, чтобы checkout настроил git для пуша коммитов и тегов
          token: ${{ secrets.GITHUB_TOKEN }} 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Sync Script
        env:
          # КРИТИЧЕСКИ ВАЖНО: Явно пробрасываем токен в переменные окружения для Python
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync.py
