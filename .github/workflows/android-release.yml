name: Android Release

# Builds a release APK whenever a v* tag is pushed.
# The APK is uploaded both as a workflow artifact and attached to the
# GitHub release that triggered the build.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # needed by softprops/action-gh-release to upload release assets

jobs:
  lint-and-test:
    name: Lint + Test (Rust)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Rust Toolchain (stable + clippy + rustfmt)
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: clippy, rustfmt

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          neuron-encrypt/target
          android/neuron-encrypt-jni/target
        key: ${{ runner.os }}-lint-${{ hashFiles('neuron-encrypt/Cargo.lock', 'android/neuron-encrypt-jni/Cargo.lock') }}

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: rustfmt check (core)
      working-directory: neuron-encrypt
      run: cargo fmt --all -- --check

    - name: rustfmt check (JNI)
      working-directory: android/neuron-encrypt-jni
      run: cargo fmt --all -- --check

    - name: clippy (core)
      working-directory: neuron-encrypt
      run: cargo clippy --all-targets -- -D warnings

    - name: clippy (JNI)
      working-directory: android/neuron-encrypt-jni
      run: cargo clippy --all-targets -- -D warnings

    - name: cargo test (core, release mode for faster Argon2id)
      working-directory: neuron-encrypt
      run: cargo test --lib --release

    - name: cargo audit (core)
      working-directory: neuron-encrypt
      run: cargo audit

    - name: cargo audit (JNI)
      working-directory: android/neuron-encrypt-jni
      run: cargo audit

  build-apk:
    name: Build Release APK
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          android/neuron-encrypt-jni/target
        key: ${{ runner.os }}-android-release-cargo-${{ hashFiles('android/neuron-encrypt-jni/Cargo.lock', 'neuron-encrypt/Cargo.lock') }}

    - name: Install cargo-ndk
      run: cargo install cargo-ndk --locked

    - name: Build Rust JNI Libraries (4 ABIs)
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        chmod +x android/build-rust.sh
        ./android/build-rust.sh

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.5

    - name: Set up Gradle Wrapper
      run: |
        cd android
        gradle wrapper --gradle-version 8.5

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease

    - name: Sign APK (debug key fallback)
      # If no upload-keystore.jks secret is configured, fall back to the debug
      # signing key so the APK at least installs on real devices. Production
      # releases should set UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD,
      # UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD secrets.
      env:
        UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      run: |
        cd android
        if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
          echo "No upload keystore secret found; using debug signing key."
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$ANDROID_HOME/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android || \
          ./gradlew assembleDebug
        else
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/upload-keystore.jks \
            -Pandroid.injected.signing.store.password=$UPLOAD_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$UPLOAD_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$UPLOAD_KEY_PASSWORD
          rm -f upload-keystore.jks
        fi

    - name: Locate built APK
      id: apk
      run: |
        APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
        echo "apk_path=$APK" >> $GITHUB_OUTPUT
        echo "Found APK: $APK"
        cp "$APK" NeuronEncrypt-Android.apk

    - name: Compute SHA-256
      run: |
        sha256sum NeuronEncrypt-Android.apk > NeuronEncrypt-Android.apk.sha256
        echo "## SHA-256" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat NeuronEncrypt-Android.apk.sha256 >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: NeuronEncrypt-Android-apk
        path: |
          NeuronEncrypt-Android.apk
          NeuronEncrypt-Android.apk.sha256
        retention-days: 90

    - name: Attach APK to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          NeuronEncrypt-Android.apk
          NeuronEncrypt-Android.apk.sha256
        generate_release_notes: true
        draft: false
        prerelease: false
