[package]
name = "neuron-encrypt"
version = "2.3.0"
edition = "2021"
description = "Military-grade file encryption — AES-256-GCM-SIV · Argon2id · HKDF-SHA512"
license = "GPL-3.0-only"
authors = ["Ubaid ur Rehman <arifubaid0345@gmail.com>"]
readme = "README.md"
keywords = ["encryption", "aes", "argon2", "cli", "crypto"]
categories = ["command-line-utilities", "cryptography"]
repository = "https://gitlab.com/theredhacker0345/neuron-encrypt"
homepage = "https://theredhacker0345.gitlab.io/neuron-encrypt/"
documentation = "https://docs.rs/neuron-encrypt"

include = [
    "src/**",
    "assets/**",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "build.rs",
    "build.bat",
]

# Library crate exposing crypto and error types for Rust consumers.
# For C/Swift FFI, additional extern "C" wrappers and cbindgen config are required.
[lib]
name = "neuron_encrypt_core"
path = "src/lib.rs"

[[bin]]
name = "neuron-encrypt"
path = "src/main.rs"
# GUI-only binary. Without this, building with `--no-default-features` (the
# headless CLI configuration used to cross-compile for macOS) would still try to
# compile eframe/egui and fail on the missing AppKit/Metal frameworks.
required-features = ["gui"]

[[bin]]
name = "neuron-encrypt-cli"
path = "src/bin/cli.rs"
# The CLI's `scrub` subcommand is built on the core's metadata module, so it
# cannot be built without the `metadata` feature. Declaring it here keeps
# `cargo build --no-default-features` (a pure-crypto build) from failing with
# "unresolved import" instead of simply skipping this binary.
required-features = ["metadata"]

[dependencies]
aes-gcm-siv = { version = "0.11", features = ["std", "aes"] }
aead = { version = "0.5", features = ["stream"] }
argon2      = { version = "0.5",  features = ["std"] }
hkdf        = "0.12"
sha2        = "0.10"
zeroize     = { version = "1.7",  features = ["derive"] }
rand_core   = { version = "0.6",  features = ["getrandom"] }
thiserror   = "1.0.61"
crossbeam-channel = "0.5"
hex = "0.4.3"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Metadata scrubbing (optional, on by default; JNI opts in explicitly)
lopdf        = { version = "0.44", optional = true }
zip          = { version = "8.6", default-features = false, features = ["deflate"], optional = true }
lofty        = { version = "0.25", optional = true }

[features]
default = ["metadata", "gui"]
metadata = ["dep:lopdf", "dep:zip", "dep:lofty"]
# The desktop GUI stack. Kept behind a feature so the CLI can be cross-compiled
# headlessly (notably for macOS, where eframe pulls in AppKit/Metal and cannot
# be cross-linked from Linux without a full macOS SDK). The CLI uses none of
# these crates, so `--no-default-features --features metadata` yields a CLI that
# depends on nothing platform-specific.
gui = ["dep:eframe", "dep:egui", "dep:rfd", "dep:image", "dep:open"]

[target.'cfg(not(target_os = "android"))'.dependencies]
# Ctrl-C handling for the CLI: an interrupted operation unwinds through the
# core's cancellation checks (which delete scratch files and never leave a
# half-written output) instead of being killed with a `*.tmp` behind it.
# Desktop/CLI only - not compiled for Android.
ctrlc = "3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
indicatif = "0.18.4"
rpassword = "7"
tempfile = "3"

# GUI-only. `open` is used by the desktop GUI to reveal a file in the system
# file manager, and the image/rfd/eframe/egui stack is the windowing layer.
open = { version = "5", optional = true }
image = { version = "0.25", optional = true }
eframe = { version = "0.33", features = ["default"], optional = true }
egui = { version = "0.33", optional = true }
rfd = { version = "0.15", optional = true }

[lints.clippy]
explicit_auto_deref = "allow"

[dev-dependencies]
# Independent EXIF verification in metadata scrubber tests.
kamadak-exif = "0.6"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
# NOT `panic = "abort"`.
#
# Two reasons, both about hostile input:
#
#  1. The metadata scrubber parses attacker-controlled files with third-party
#     crates (lofty, lopdf, zip). A panic in one of them used to abort the
#     whole process — in the Windows GUI, which has no console, that is a
#     silent death with no message. With unwinding, the scrubber catches the
#     panic and turns it into the ordinary "unsupported / malformed file"
#     error its fail-closed contract promises.
#  2. With `abort`, the `Drop` impls of the `Zeroizing` guards never run on a
#     panic, so a passphrase or plaintext buffer could survive in RAM. With
#     unwinding they are wiped during the unwind.
#
# The Android JNI crate never set `panic = "abort"` either, so its
# `catch_unwind` wrappers around the native entry points work as intended.
