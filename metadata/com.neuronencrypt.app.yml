Builds:
  - versionName: "2.1.0"
    versionCode: 3
    commit: v2.1.0
    subdir: android
    gradle:
      - fdroidRelease
    prebuild: |
      cd neuron-encrypt-jni
      cargo ndk --platform 24 \
        -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
        -o ../app/src/main/jniLibs \
        build --release
    output: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
    Reproducible: false