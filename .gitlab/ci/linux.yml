# Linux pipeline — standalone child pipeline
# Triggered from parent .gitlab-ci.yml (job "linux")
#
# Speed notes:
# - cargo registry/target cached (key on Cargo.lock)
# - tests intentionally NOT run here (they run in the MR quality pipeline)

stages:
  - build
  - package

variables:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: "always"
  CARGO_INCREMENTAL: "0"

cache:
  key:
    files:
      - neuron-encrypt/Cargo.lock
    prefix: linux
  paths:
    - .cargo-home/
    - neuron-encrypt/target/

build-linux:
  stage: build
  image: rust:1.88-slim
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends clang lld pkg-config libssl-dev build-essential curl
  script:
    - echo "Building for Linux x86_64..."
    - cd neuron-encrypt
    - cargo build --release --locked --bin neuron-encrypt --bin neuron-encrypt-cli
  artifacts:
    paths:
      - neuron-encrypt/target/release/neuron-encrypt
      - neuron-encrypt/target/release/neuron-encrypt-cli
    expire_in: "30 days"

package-linux:
  stage: package
  needs: [build-linux]
  image: alpine:3.20
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  script:
    - apk add --no-cache tar curl
    - VERSION=$(grep '^version' neuron-encrypt/Cargo.toml | head -1 | cut -d'"' -f2)
    - NAME="neuron-encrypt-$VERSION-linux-x86_64"
    - mkdir -p release/$NAME
    - cp neuron-encrypt/target/release/neuron-encrypt release/$NAME/
    - cp neuron-encrypt/target/release/neuron-encrypt-cli release/$NAME/
    - tar -czf $NAME.tar.gz -C release $NAME
    - sha256sum $NAME.tar.gz > SHA256SUMS-linux.txt
    - cat SHA256SUMS-linux.txt
    # Permanent product links (generic package registry — never expires).
    # Publish the archive for GUI + CLI users and a standalone CLI binary for scripts.
    - |
      curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file $NAME.tar.gz \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/neuron-encrypt/${VERSION}/${NAME}.tar.gz" \
      && echo "PRODUCT LINK (stable): ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/neuron-encrypt/${VERSION}/${NAME}.tar.gz" \
      && echo "Browse: ${CI_PROJECT_URL}/-/packages/generic/neuron-encrypt/${VERSION}" \
      || echo "WARN: package upload failed (registry disabled?)"
    - |
      CLI_NAME="neuron-encrypt-cli-${VERSION}-linux-x86_64"
      cp neuron-encrypt/target/release/neuron-encrypt-cli "$CLI_NAME"
      sha256sum "$CLI_NAME" > SHA256SUMS-cli-linux.txt
      curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "$CLI_NAME" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/neuron-encrypt-cli/${VERSION}/${CLI_NAME}"
      echo "CLI PRODUCT LINK (stable): ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/neuron-encrypt-cli/${VERSION}/${CLI_NAME}"
      curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file SHA256SUMS-cli-linux.txt \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/neuron-encrypt-cli/${VERSION}/SHA256SUMS-cli-linux.txt"
    - |
      curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file SHA256SUMS-linux.txt \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/neuron-encrypt/${VERSION}/SHA256SUMS-linux.txt" \
      || true
  artifacts:
    paths:
      - neuron-encrypt-*-linux-x86_64.tar.gz
      - SHA256SUMS-linux.txt
    expire_in: "30 days"
