# Android pipeline — standalone child pipeline
# Triggered from parent .gitlab-ci.yml (job "android")
#
# Speed optimizations (kept deliberately conservative):
# - single cache entry: Android SDK+NDK (.ci-android), cargo home, gradle homes
#   => the 2 GB NDK download/install happens once, not per run
# - prebuilt cargo-ndk binary (~15 s) instead of compiling from source (~4 min)
# - no tests in release build job (they live in the MR quality pipeline)

stages:
  - build
  - package

variables:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: "always"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.ci-android/sdk"
  ANDROID_HOME: "$CI_PROJECT_DIR/.ci-android/sdk"
  ANDROID_NDK_HOME: "$CI_PROJECT_DIR/.ci-android/sdk/ndk/26.1.10909125"
  ANDROID_NDK_ROOT: "$CI_PROJECT_DIR/.ci-android/sdk/ndk/26.1.10909125"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"

cache:
  key: android-v2
  paths:
    - .ci-android/sdk/
    - .cargo-home/
    - .gradle-home/
    - android/.gradle/

build-android-apk:
  stage: build
  image: rust:1.88-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openjdk-17-jdk-headless unzip wget curl ca-certificates clang lld pkg-config libssl-dev build-essential file git
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - export PATH="$JAVA_HOME/bin:$HOME/.cargo/bin:$PATH"
    # ---- SDK + NDK (skips when restored from cache) -----------------------
    - |
      if [ ! -f "$ANDROID_NDK_HOME/source.properties" ]; then
        echo "Installing Android SDK + NDK into $ANDROID_HOME ..."
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
          "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.1.10909125" > /dev/null
      else
        echo "SDK/NDK restored from cache"
      fi
    - test -f "$ANDROID_NDK_HOME/source.properties" || { echo "FATAL: NDK missing after setup"; exit 1; }
    # ---- Rust targets + cargo-ndk (prebuilt binary, falls back to source) -
    - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
    - mkdir -p "$CARGO_HOME/bin"
    - |
      if [ ! -x "$CARGO_HOME/bin/cargo-ndk" ]; then
        curl -sSfL https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz \
          | tar -xz -C "$CARGO_HOME/bin" \
          && chmod +x "$CARGO_HOME/bin/cargo-ndk" \
          || { echo "prebuilt download failed; compiling from source"; cargo install cargo-ndk --locked --version 4.1.2; }
      fi
    - export PATH="$CARGO_HOME/bin:$PATH"
    - cargo ndk --version
  script:
    - echo "Building Android JNI libs (4 ABIs)..."
    - chmod +x android/build-rust.sh
    - ./android/build-rust.sh
    - echo "Assembling APK..."
    - cd android
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - export PATH="$JAVA_HOME/bin:$PATH"
    - ./gradlew :app:assembleStandardDebug --no-daemon
  artifacts:
    paths:
      - android/app/build/outputs/apk/standard/debug/app-standard-debug.apk
    expire_in: 30 days

package-android:
  stage: package
  needs: [build-android-apk]
  image: alpine:3.20
  script:
    - apk add --no-cache curl
    - VERSION=$(grep '^version' neuron-encrypt/Cargo.toml | head -1 | cut -d'"' -f2)
    - NAME="neuron-encrypt-$VERSION-android.apk"
    - cp android/app/build/outputs/apk/standard/debug/app-standard-debug.apk $NAME
    - sha256sum $NAME > SHA256SUMS-android.txt
    - cat SHA256SUMS-android.txt
    # Permanent product link (generic package registry — never expires)
    - |
      curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file $NAME \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/neuron-encrypt/${VERSION}/${NAME}" \
      && echo "PRODUCT LINK (stable): ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/neuron-encrypt/${VERSION}/${NAME}" \
      && echo "Browse: ${CI_PROJECT_URL}/-/packages/generic/neuron-encrypt/${VERSION}"
    - |
      curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file SHA256SUMS-android.txt \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/neuron-encrypt/${VERSION}/SHA256SUMS-android.txt" \
      || true
  artifacts:
    paths:
      - neuron-encrypt-*-android.apk
      - SHA256SUMS-android.txt
    expire_in: 30 days
