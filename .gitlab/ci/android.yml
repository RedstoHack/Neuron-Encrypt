# Android pipeline — standalone child pipeline
# Builds the Rust JNI lib (4 ABIs) + Gradle APK.
# If Google's SDK repos are unreachable from the runner, set these CI/CD
# variables to a pre-provisioned machine: ANDROID_SDK_ROOT, ANDROID_NDK_HOME.
# Triggered from parent .gitlab-ci.yml (job "android")

stages:
  - build
  - package

variables:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: "always"
  ANDROID_SDK_ROOT: /opt/android-sdk
  ANDROID_HOME: /opt/android-sdk
  ANDROID_NDK_HOME: /opt/android-sdk/ndk/26.1.10909125
  ANDROID_NDK_ROOT: /opt/android-sdk/ndk/26.1.10909125

.setup-android: &setup-android
  - apt-get update && apt-get install -y --no-install-recommends openjdk-17-jdk-headless unzip wget curl ca-certificates clang lld pkg-config libssl-dev build-essential file git
  - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
  - export PATH="$JAVA_HOME/bin:$PATH"
  # Skip SDK download if runner already has it provisioned
  - |
    if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
      mkdir -p $ANDROID_HOME/cmdline-tools
      wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip \
        || echo "WARN: cannot download cmdline-tools; assuming pre-provisioned SDK"
      unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools 2>/dev/null || true
      mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest 2>/dev/null || true
    fi
  - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
  - yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses >/dev/null 2>&1 || true
  - sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.1.10909125" 2>&1 | tail -1 || true
  - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
  - cargo install cargo-ndk --locked --version 4.1.2

build-android-apk:
  stage: build
  image: rust:1.88-slim
  before_script: *setup-android
  script:
    - echo "Building Android JNI libs (4 ABIs)..."
    - chmod +x android/build-rust.sh
    - ./android/build-rust.sh
    - echo "Assembling APK..."
    - cd android
    - ./gradlew :app:assembleStandardDebug --no-daemon
  artifacts:
    paths:
      - android/app/build/outputs/apk/standard/debug/app-standard-debug.apk
    expire_in: 30 days

package-android:
  stage: package
  needs: [build-android-apk]
  image: alpine:3.20
  script:
    - VERSION=$(grep '^version' neuron-encrypt/Cargo.toml | head -1 | cut -d'"' -f2)
    - echo "Packaging neuron-encrypt-$VERSION-android.apk"
    - cp android/app/build/outputs/apk/standard/debug/app-standard-debug.apk neuron-encrypt-$VERSION-android.apk
    - sha256sum neuron-encrypt-$VERSION-android.apk > SHA256SUMS-android.txt
    - cat SHA256SUMS-android.txt
  artifacts:
    paths:
      - neuron-encrypt-*-android.apk
      - SHA256SUMS-android.txt
    expire_in: 30 days
