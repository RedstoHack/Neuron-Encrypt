# Android pipeline — standalone child pipeline
# Triggered from parent .gitlab-ci.yml (job "android")
#
# Speed optimizations (kept deliberately conservative):
# - single cache entry: Android SDK+NDK (.ci-android), cargo home, gradle homes
#   => the 2 GB NDK download/install happens once, not per run
# - prebuilt cargo-ndk binary (~15 s) instead of compiling from source (~4 min)
# - no tests in release build job (they live in the MR quality pipeline)

stages:
  - build
  - package

variables:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: "always"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.ci-android/sdk"
  ANDROID_HOME: "$CI_PROJECT_DIR/.ci-android/sdk"
  ANDROID_NDK_HOME: "$CI_PROJECT_DIR/.ci-android/sdk/ndk/26.1.10909125"
  ANDROID_NDK_ROOT: "$CI_PROJECT_DIR/.ci-android/sdk/ndk/26.1.10909125"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"

cache:
  # The SDK/NDK and cargo-ndk are stable tooling, so they keep a static key and
  # the ~2 GB NDK is installed once rather than per run.
  #
  # The compiled JNI objects are cached separately, keyed on the lockfile, so
  # they do not live in a multi-gigabyte archive that is re-uploaded whenever
  # the tooling changes. They were previously not cached at all, which meant
  # every run recompiled all four ABIs from scratch (1,065 s on 2026-10-01);
  # a rebuild that only changes Kotlin or Gradle now reuses them.
  - key: android-toolchain-v3
    paths:
      - .ci-android/sdk/
      - .cargo-home/
      - .gradle-home/
      - android/.gradle/
  - key:
      files:
        - android/neuron-encrypt-jni/Cargo.lock
        - neuron-encrypt/Cargo.lock
      prefix: android-jni
    paths:
      - android/neuron-encrypt-jni/target/

build-android-apk:
  stage: build
  image: rust:1.88-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openjdk-17-jdk-headless unzip wget curl ca-certificates clang lld pkg-config libssl-dev build-essential file git
    - bash .gitlab/ci/setup-android.sh
  script:
    - echo "Building Android JNI libs (4 ABIs)..."
    - chmod +x android/build-rust.sh
    - ./android/build-rust.sh
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - export PATH="$JAVA_HOME/bin:$PATH"
    - cd android
    # Two artifacts, two audiences:
    #  - fdroidRelease: unsigned, for F-Droid (which signs with its own key).
    #  - standardRelease: signed with the keystore in CI variables, for people
    #    downloading from the release page. Without this the only APK published
    #    was unsigned and could not be installed outside F-Droid.
    - echo "Assembling release APK (fdroid flavor — unsigned)..."
    - ./gradlew :app:assembleFdroidRelease --no-daemon
    - echo "Assembling release APK (standard flavor — signed)..."
    - ./gradlew :app:assembleStandardRelease --no-daemon
  artifacts:
    paths:
      - android/app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
      - android/app/build/outputs/apk/standard/release/app-standard-release.apk
    expire_in: "30 days"

package-android:
  stage: package
  needs: [build-android-apk]
  image: alpine:3.20
  script:
    - apk add --no-cache curl
    # Read version from Cargo.toml (source of truth for all platforms)
    - VERSION=$(grep '^version' neuron-encrypt/Cargo.toml | head -1 | cut -d'"' -f2)
    - APK_NAME="neuron-encrypt-${VERSION}-android.apk"
    - cp android/app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk "$APK_NAME"
    - sha256sum "$APK_NAME" > SHA256SUMS-android.txt
    - cat SHA256SUMS-android.txt
    # Upload to Package Registry (permanent, never expires)
    - sh .gitlab/ci/publish-android.sh "$APK_NAME" "$VERSION"
    # The signed APK is the one people actually install, so it is published
    # under its own package name to keep the two from colliding.
    - |
      if [ -f android/app/build/outputs/apk/standard/release/app-standard-release.apk ]; then
        SIGNED="neuron-encrypt-${VERSION}-android-signed.apk"
        cp android/app/build/outputs/apk/standard/release/app-standard-release.apk "$SIGNED"
        sha256sum "$SIGNED" > SHA256SUMS-android-signed.txt
        curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$SIGNED" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/neuron-encrypt-android/${VERSION}/${SIGNED}"
        curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file SHA256SUMS-android-signed.txt \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/neuron-encrypt-android/${VERSION}/SHA256SUMS-android-signed.txt" || true
        echo "SIGNED APK: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/neuron-encrypt-android/${VERSION}/${SIGNED}"
      else
        echo "WARN: signed APK not produced (keystore variables missing?)"
      fi
  artifacts:
    paths:
      - neuron-encrypt-*-android*.apk
      - SHA256SUMS-android*.txt
    expire_in: "30 days"
