# macOS pipeline — standalone child pipeline
# Requires a self-hosted macOS runner registered with tag "macos".
# On GitLab.com shared runners this job will stay pending until such a
# runner exists (the parent job has allow_failure so it never blocks).
# Triggered from parent .gitlab-ci.yml (job "macos")

stages:
  - build
  - package

variables:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: "always"
  CARGO_INCREMENTAL: "0"
  MACOSX_DEPLOYMENT_TARGET: "10.15"

build-macos:
  stage: build
  tags:
    - macos
  script:
    - echo "Building for macOS x86_64 on native runner..."
    - rustup target add x86_64-apple-darwin aarch64-apple-darwin
    - cargo build --release --locked --target x86_64-apple-darwin --bin neuron-encrypt --bin neuron-encrypt-cli
    # Apple Silicon (best-effort, same runner can usually cross-compile it)
    - cargo build --release --locked --target aarch64-apple-darwin --bin neuron-encrypt --bin neuron-encrypt-cli || echo "aarch64 build skipped"
  artifacts:
    paths:
      - neuron-encrypt/target/x86_64-apple-darwin/release/neuron-encrypt
      - neuron-encrypt/target/x86_64-apple-darwin/release/neuron-encrypt-cli
    expire_in: 30 days

package-macos:
  stage: package
  needs: [build-macos]
  tags:
    - macos
  script:
    - VERSION=$(grep '^version' neuron-encrypt/Cargo.toml | head -1 | cut -d'"' -f2)
    - mkdir -p release/neuron-encrypt-$VERSION-macos-x86_64
    - cp neuron-encrypt/target/x86_64-apple-darwin/release/neuron-encrypt release/neuron-encrypt-$VERSION-macos-x86_64/
    - cp neuron-encrypt/target/x86_64-apple-darwin/release/neuron-encrypt-cli release/neuron-encrypt-$VERSION-macos-x86_64/
    - tar -czf neuron-encrypt-$VERSION-macos-x86_64.tar.gz -C release neuron-encrypt-$VERSION-macos-x86_64
    - shasum -a 256 neuron-encrypt-$VERSION-macos-x86_64.tar.gz > SHA256SUMS-macos.txt
    - cat SHA256SUMS-macos.txt
    - |
      CLI_NAME="neuron-encrypt-cli-${VERSION}-macos-x86_64"
      cp neuron-encrypt/target/x86_64-apple-darwin/release/neuron-encrypt-cli "$CLI_NAME"
      shasum -a 256 "$CLI_NAME" > SHA256SUMS-cli-macos.txt
      curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "$CLI_NAME" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/neuron-encrypt-cli/${VERSION}/${CLI_NAME}"
      echo "CLI PRODUCT LINK (stable): ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/neuron-encrypt-cli/${VERSION}/${CLI_NAME}"
      curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file SHA256SUMS-cli-macos.txt \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/neuron-encrypt-cli/${VERSION}/SHA256SUMS-cli-macos.txt"

  artifacts:
    paths:
      - neuron-encrypt-*-macos-x86_64.tar.gz
      - SHA256SUMS-macos.txt
    expire_in: 30 days
